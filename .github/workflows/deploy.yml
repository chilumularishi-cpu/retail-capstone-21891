name: Databricks CI-CD

on:
  push:
    branches:
      - dev
      - uat
      - main
  pull_request:
    branches:
      - dev
      - uat
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest tests/

  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    needs: test
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
      # DATABRICKS_CLUSTER_ID: ${{ secrets.DATABRICKS_CLUSTER_ID_DEV }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          pip install databricks-cli

      - name: Validate bundle
        run: |
          databricks bundle validate --target dev

      - name: Deploy bundle
        run: |
          databricks bundle deploy --target dev

  deploy-uat:
    if: github.ref == 'refs/heads/uat'
    needs: test
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_UAT }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_UAT }}
      # DATABRICKS_CLUSTER_ID: ${{ secrets.DATABRICKS_CLUSTER_ID_UAT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          pip install databricks-cli

      - name: Validate bundle
        run: |
          databricks bundle validate --target uat

      - name: Deploy bundle
        run: |
          databricks bundle deploy --target uat

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
      # DATABRICKS_CLUSTER_ID: ${{ secrets.DATABRICKS_CLUSTER_ID_PROD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
#LastUpdateTest
      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: |
          databricks bundle validate --target prod

      - name: Deploy bundle
        run: |
          databricks bundle deploy --target prod
