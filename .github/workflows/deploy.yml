name: Databricks CI-CD

on:
  push:
    branches:
      - dev
      - uat
      - main
  pull_request:
    branches:
      - dev
      - uat
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          pip install pytest

      - name: Run tests
        run: |
          pytest tests/

  validate-pr:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Show repo files
        run: |
          pwd
          ls -la
          find . -maxdepth 2 -type f | sort

      - name: Validate bundle for PR target branch
        run: |
          if [ "${{ github.base_ref }}" = "dev" ]; then
            databricks bundle validate --target dev
          elif [ "${{ github.base_ref }}" = "uat" ]; then
            databricks bundle validate --target uat
          elif [ "${{ github.base_ref }}" = "main" ]; then
            databricks bundle validate --target prod
          else
            echo "Unsupported PR base branch: ${{ github.base_ref }}"
            exit 1
          fi

  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: |
          databricks bundle validate --target dev

      - name: Deploy bundle
        run: |
          databricks bundle deploy --target dev

  deploy-uat:
    if: github.event_name == 'push' && github.ref == 'refs/heads/uat'
    needs: test
    runs-on: ubuntu-latest
    environment: uat
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_UAT }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_UAT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: |
          databricks bundle validate --target uat

      - name: Deploy bundle
        run: |
          databricks bundle deploy --target uat

  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: prod
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: |
          databricks bundle validate --target prod

      - name: Deploy bundle
        run: |
          databricks bundle deploy --target prod
